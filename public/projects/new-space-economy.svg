<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The New Space Economy — FIAP Global Solution">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="55%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.45" />
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Subtle orbital rings on right -->
  <g opacity="0.22" transform="translate(880, 338)">
    <circle cx="0" cy="0" r="210" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 8" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="#60a5fa" stroke-width="2" />
    <circle cx="0" cy="0" r="68" fill="#1d4ed8" fill-opacity="0.35" stroke="#93c5fd" stroke-width="2" />
    <circle cx="140" cy="0" r="9" fill="#60a5fa" />
    <circle cx="-148" cy="-148" r="7" fill="#93c5fd" />
  </g>

  <!-- Content container -->
  <g transform="translate(88, 130)">
    <rect x="0" y="0" width="250" height="38" rx="19" fill="#1e3a8a" fill-opacity="0.55" stroke="#3b82f6" stroke-width="1.5" />
    <text x="125" y="24" text-anchor="middle" fill="#93c5fd" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" letter-spacing="1.2">
      FIAP GLOBAL SOLUTION
    </text>

    <text x="0" y="115" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="700" letter-spacing="-0.5">
      The New Space
    </text>
    <text x="0" y="180" fill="#60a5fa" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="48" font-weight="600" letter-spacing="-0.5">
      Economy
    </text>

    <rect x="0" y="220" width="96" height="5" rx="2.5" fill="url(#accent)" />

    <text x="0" y="275" fill="#a1a1aa" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="400">
      Distributed Web Solution for Spatial Data Cataloging &amp; Analysis
    </text>

    <g transform="translate(0, 335)">
      <rect x="0" y="0" width="190" height="40" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
      <text x="95" y="26" text-anchor="middle" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="600">Distributed Web</text>

      <rect x="206" y="0" width="166" height="40" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
      <text x="289" y="26" text-anchor="middle" fill="#e4e4e7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="600">Spatial Data</text>
    </g>
  </g>
</svg>

